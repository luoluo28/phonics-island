<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音标勇者岛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f8f5f0;color:#444;padding:16px;padding-bottom:40px}
.container{max-width:720px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:20px;color:#e85b4e}
.tag{background:#fff;border-radius:99px;padding:6px 14px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,0.05);margin-bottom:16px}
.tab-wrap{display:flex;gap:8px;margin-bottom:16px;justify-content:center}
.tab{padding:8px 16px;border-radius:99px;background:#eee;color:#777;cursor:pointer}
.tab.active{background:#b8d8f8;color:#222;font-weight:500}
.play-btn{width:72px;height:72px;border-radius:50%;background:#ffcd60;border:none;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(255,205,96,0.45);cursor:pointer}
.listen-box{background:#e8f4ff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;margin:12px 0}
.mouth-card{background:#fff2e4;border-radius:16px;padding:20px;text-align:center;margin:16px 0}
.letter-tag{background:#eee;border-radius:99px;padding:6px 16px;display:inline-block;margin:8px 0}
.listen-area{background:#e8f4ff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;margin:12px 0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:999;display:none}
#recogConfirmBtn{padding:10px 20px;border-radius:99px;border:none;background:#ffd175;font-size:16px;margin-top:12px;cursor:pointer}
.footer-note{text-align:center;margin-top:30px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">🍓 音标勇者岛</div>
<div style="display:flex;gap:10px">
<div class="tag">💰2</div>
<div class="tag">进阶</div>
<div class="tag">⭐0</div>
</div>
</div>
<div class="card">
<div class="tab-wrap">
<div class="tab">1 听辨</div>
<div class="tab active">2 跟读</div>
<div class="tab">3 拼读</div>
</div>
<h2 style="text-align:center;margin-bottom:16px">照口型读: /æ/</h2>
<div class="listen-box">
<button class="play-btn" id="audioPlayBtn">▶</button>
<div>先听标准发音，再跟着读 hat (帽子)</div>
</div>
<div class="mouth-card">
<div style="font-size:24px;margin-bottom:10px">👄 口型这样做</div>
<div style="font-size:22px;line-height:1.6">嘴巴大张、下巴下拉，像<span style="color:#e85b4e">啊</span>但更短促</div>
<div style="margin-top:12px;color:#e85b4e;font-weight:500">⚠️ 别读成拼音 a</div>
</div>
<div style="text-align:center">
<div class="letter-tag">字母组合: a</div>
</div>
<div class="listen-area">
<div class="play-btn" style="background:#ffd175">...</div>
<div>🎧 正在听，请跟着读 hat ...</div>
</div>
<div style="text-align:center;margin-top:20px;color:#999">读不准也没关系，多试几次，小向导等你!</div>
</div>
<div class="footer-note">© 罗曼蒂 · 小红书 4749740482<br>音标勇者岛 · 免费启蒙小游戏</div>
</div>
<div class="toast" id="toast"></div>

<script>
let speechOK = true;
let voiceList = [];
const isMobile = /Android|iPhone|iPad|iPod|WeiXin|MicroMessenger/i.test(navigator.userAgent);
const TTS_BASE_URL = "https://dict.youdao.com/dictvoice?audio=";
let audioPlayer = new Audio();

let recognition = null;
let recogTimer = null;
const MAX_LISTEN_DURATION = 8000;
let isListening = false;
const targetWord = "hat";

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.innerText = msg;
  t.style.display="block";
  setTimeout(()=>{t.style.display="none"},2200);
}

// 修复：getVoices 兼容写法，不直接await
function initSpeech() {
  if (!isMobile && 'speechSynthesis' in window) {
    function loadVoices(){
      voiceList = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
      speechOK = voiceList.length > 0;
    }
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  } else {
    speechOK = false;
  }
}

function playAudio(word) {
  // 停止之前语音，防止叠音
  speechSynthesis.cancel();
  audioPlayer.pause();
  audioPlayer.currentTime = 0;

  if (/[æɑːɪʊɔːəʌ]/.test(word)) {
    if (speechOK) {
      const utter = new SpeechSynthesisUtterance(word);
      if(voiceList[0]) utter.voice = voiceList[0];
      utter.rate = 0.85;
      speechSynthesis.speak(utter);
      return;
    } else {
      showToast("暂无法播放该音标音频");
      return;
    }
  }
  const audioUrl = TTS_BASE_URL + encodeURIComponent(word);
  audioPlayer.src = audioUrl;
  audioPlayer.play().catch(() => {
    showToast("发音加载失败，请检查网络");
  });
}

function initRecognition() {
  if (!('webkitSpeechRecognition' in window)) return false;
  recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = (e) => {
    clearTimeout(recogTimer);
    let transcript = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    isListening = false;
    recognition.stop();
    if(typeof handleRecogResult === "function"){
      handleRecogResult(transcript.trim());
    }
  };

  recognition.onerror = (e) => {
    clearTimeout(recogTimer);
    isListening = false;
    recognition.stop();
    if (e.error === 'network') {
      showToast("语音识别网络不稳定");
      showManualConfirmBtn();
    } else if (e.error === 'no-speech') {
      showToast("未检测到朗读声音");
      showManualConfirmBtn();
    } else if (e.error === 'not-allowed') {
      showToast("麦克风权限被拒绝，请在浏览器设置开启");
    }
  };

  recognition.onend = () => {
    clearTimeout(recogTimer);
    isListening = false;
  }
  return true;
}

function startListen() {
  if (!recognition) {
    showManualConfirmBtn();
    return;
  }
  if(isListening) return;
  isListening = true;
  recognition.start();
  recogTimer = setTimeout(() => {
    isListening = false;
    recognition.stop();
    showToast("识别超时，读完后点击确认继续");
    showManualConfirmBtn();
  }, MAX_LISTEN_DURATION);
}

function stopListen() {
  clearTimeout(recogTimer);
  if (recognition && isListening) {
    recognition.stop();
  }
  isListening = false;
}

function showManualConfirmBtn() {
  if(document.getElementById('recogConfirmBtn')) return;
  const listenWrap = document.querySelector(".listen-area");
  if(!listenWrap) return;
  const btnWrap = document.createElement('div');
  btnWrap.style.textAlign = "center";
  btnWrap.style.marginTop = "16px";
  const confirmBtn = document.createElement('button');
  confirmBtn.id = 'recogConfirmBtn';
  confirmBtn.innerText = "✅ 我读完了，继续";
  confirmBtn.style.padding = "10px 20px";
  confirmBtn.style.borderRadius = "99px";
  confirmBtn.style.border = "none";
  confirmBtn.style.background = "#ffd175";
  confirmBtn.style.fontSize = "16px";
  confirmBtn.onclick = () => {
    removeConfirmBtn();
    if(typeof nextStep === "function") nextStep();
  }
  btnWrap.appendChild(confirmBtn);
  listenWrap.parentNode.appendChild(btnWrap);
}

function removeConfirmBtn() {
  const el = document.getElementById('recogConfirmBtn');
  if(el) el.remove();
}

function resetListenState() {
  stopListen();
  removeConfirmBtn();
}

function handleRecogResult(text){
  showToast("识别结果："+text);
  nextStep();
}

function nextStep(){
  showToast("进入下一题");
  resetListenState();
}

document.addEventListener("DOMContentLoaded",()=>{
  initSpeech();
  initRecognition();
  const playBtn = document.getElementById("audioPlayBtn");
  if(playBtn){
    playBtn.onclick = ()=>playAudio(targetWord);
  }
  setTimeout(()=>startListen(),400);
})

window.addEventListener("beforeunload",resetListenState);
</script>
</body>
</html>
